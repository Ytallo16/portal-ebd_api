name: Deploy (produção)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portal_ebd_test
          POSTGRES_USER: portal_ebd
          POSTGRES_PASSWORD: portal_ebd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_ebd -d portal_ebd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      POSTGRES_DB: portal_ebd_test
      POSTGRES_USER: portal_ebd
      POSTGRES_PASSWORD: portal_ebd
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar configuração e migrações
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Executar testes
        run: python manage.py test

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar código para o servidor
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'staticfiles' \
            --exclude 'media' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/portal-ebd_api/"

      - name: Rebuild e restart do backend
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /home/deploy/portal-ebd_api && chmod +x docker/entrypoint.prod.sh && docker compose -f docker-compose.prod.yml up -d --build --no-deps --force-recreate backend && docker compose -f docker-compose.prod.yml ps'
